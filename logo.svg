<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left/RTL Logo Icon: Modern Shield with 'M' & 'م' Monogram -->
  <g transform="translate(15, 12)">
    <!-- Ambient Shadow & Glow -->
    <rect x="4" y="8" width="88" height="88" rx="26" fill="url(#shieldGrad)" opacity="0.35" filter="url(#glow)"/>
    
    <!-- Outer Shield Container -->
    <rect x="4" y="4" width="88" height="88" rx="26" fill="url(#shieldGrad)" />
    
    <!-- Inner Glass Border -->
    <rect x="6" y="6" width="84" height="84" rx="24" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="2" />
    
    <!-- Geometric Monogram (Letter M + Arabic Meem 'م') -->
    <g transform="translate(18, 18)" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Outer M Left Pillar -->
      <path d="M12 48 V16 L28 34 L44 16 V48" stroke="#ffffff" stroke-width="5" />
      <!-- Central Gem / Arabic Meem ring -->
      <circle cx="28" cy="24" r="7" fill="url(#goldAccent)" stroke="#ffffff" stroke-width="2.5" />
      <!-- Base Stability Arc -->
      <path d="M6 52 C18 57, 38 57, 50 52" stroke="rgba(255,255,255,0.7)" stroke-width="3" />
    </g>

    <!-- Sparkle Accent -->
    <circle cx="80" cy="18" r="4.5" fill="#fbbf24" filter="url(#glow)"/>
  </g>

  <!-- Typography: Name 'محمود' in Cairo Arabic & English Tracking Subtitle -->
  <g transform="translate(125, 30)">
    <!-- Arabic Main Name -->
    <text x="0" y="40" font-family="'Cairo', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="url(#textGrad)" letter-spacing="0.5">
      محمود
    </text>

    <!-- English & Subtitle -->
    <text x="3" y="66" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="700" font-size="12" fill="#64748b" letter-spacing="3.5">
      MAHMOUD ENTERPRISE
    </text>

    <!-- Verified Dot -->
    <circle cx="160" cy="20" r="4" fill="#10b981" />
  </g>
</svg>
